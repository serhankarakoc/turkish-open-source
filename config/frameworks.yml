# Curated Turkish-origin frameworks.
# Manual fields only: github, category, initial_status.
# Optional `name` is a display title when the GitHub repo slug is not the product name.
# Do NOT store stars, language, license, website, or owner location here.
# The scanner fills those from the GitHub API on every scan.

